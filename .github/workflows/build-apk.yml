name: Build Android APK (TWA)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Verify PWA manifest
        env:
          PWA_MANIFEST_URL: ${{ secrets.PWA_MANIFEST_URL }}
        run: curl -fsS "$PWA_MANIFEST_URL" > /dev/null

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BUBBLEWRAP_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android-twa/android.keystore
          test -s android-twa/android.keystore

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: android-twa
        env:
          TAG_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="${TAG_NAME#v}"
          sed -i "s/versionName \".*\"/versionName \"${VERSION}\"/" app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${RUN_NUMBER}/" app/build.gradle

      - name: Build release APK
        working-directory: android-twa
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Align and sign APK
        working-directory: android-twa
        env:
          KS_PASS: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/36.1.0"
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          "$BT/apksigner" sign --ks android.keystore --ks-key-alias android \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out app-release-signed.apk app-release-aligned.apk
          "$BT/apksigner" verify --print-certs app-release-signed.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stillpoint-apk
          path: android-twa/app-release-signed.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android-twa/app-release-signed.apk
