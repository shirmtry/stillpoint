[package]
name = "stillpoint"
version = "1.0.0"
description = "StillPoint desktop shell (Tauri 2 wrapper)"
authors = ["StillPoint"]
edition = "2021"

[lib]
name = "stillpoint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"